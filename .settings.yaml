# Single source of truth for tool versions and quality thresholds.
# Consumed by Makefile, CI workflows, and .golangci.yaml via yq.

# Language Versions
languages:
  go: '1.26'

# Build Tools
build_tools:
  goreleaser: 'v2.15.2'
  ko: 'v0.18.0'
  tfsec: 'v1.28.14'

# Linting
linting:
  golangci_lint: 'v2.11.3'

# Container Registry
registry:
  host: 'us-west1-docker.pkg.dev/devpulseio/devpulse-saas-images'

# Quality Thresholds
quality:
  coverage_threshold: '10'
  lint_timeout: '5m'
  test_timeout: '10m'
  build_timeout: '10m0s'
