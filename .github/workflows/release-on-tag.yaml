name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test-on-call.yaml

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Build and Push Images
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    environment: saas
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          AR="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.AR_REPO }}"
          echo "Deploying ${TAG} via ${AR}..."
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region=${{ vars.REGION }} \
            --image="${AR}/thingzio/devpulse-site:${TAG}"
          gcloud run jobs update ${{ vars.JOB_NAME }} \
            --region=${{ vars.REGION }} \
            --image="${AR}/thingzio/devpulse-import:${TAG}"
          gcloud run services update ${{ vars.ADMIN_SERVICE_NAME }} \
            --region=${{ vars.REGION }} \
            --image="${AR}/thingzio/devpulse-admin:${TAG}"

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - release
      - deploy
    permissions:
      contents: write
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
