name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test-on-call.yaml
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC in unit job

  # Container images are built and published by the shared build definition in
  # thingzio/actions, pinned by SHA. Pinning by SHA rather than tag makes the
  # SLSA provenance builder.id an immutable reference to the exact build
  # definition; verification is unaffected because --signer-workflow carries no
  # ref. See https://github.com/thingzio/actions/blob/main/docs/verification.md
  #
  # Two images, two calls: the shared workflow builds one image per invocation.
  # They are independent, so they run in parallel.
  build-site:
    needs: test
    uses: thingzio/actions/.github/workflows/build-ko.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    permissions:
      contents: read
      packages: write      # push to ghcr.io
      id-token: write      # keyless signing
      attestations: write  # SLSA provenance + SBOM
    with:
      image: thingzio/devpulse-site
      main: ./cmd/devpulse-site
      platforms: linux/amd64,linux/arm64

  build-import:
    needs: test
    uses: thingzio/actions/.github/workflows/build-ko.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    with:
      image: thingzio/devpulse-import
      main: ./cmd/devpulse-import
      platforms: linux/amd64,linux/arm64

  # Binaries, archives and a Sigstore-signed checksum file come from the shared
  # release definition, pinned by SHA for the same reason the image builds are.
  # It runs goreleaser in a job holding no OIDC token and signs the result in a
  # job that runs none of this repository's configuration, which is what makes
  # the provenance Build Level 3 rather than Level 2.
  #
  # publish: false because the draft flip is gated on a successful deploy, in
  # the publish job below. Everything is signed, verified and attested by the
  # time this returns; only visibility is deferred.
  release:
    needs: test
    uses: thingzio/actions/.github/workflows/release-go.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    permissions:
      contents: write      # create the draft release, upload artifacts
      id-token: write      # keyless signing
      attestations: write  # SLSA provenance
    with:
      publish: false

  deploy:
    needs:
      - build-site
      - build-import
      - release
    uses: ./.github/workflows/deploy-cloud-run.yaml
    with:
      # Immutable digests, not tags. Cloud Run pulls them through the Artifact
      # Registry remote repository that fronts ghcr.io.
      site_image_ref: ${{ needs.build-site.outputs.image_ref }}
      import_image_ref: ${{ needs.build-import.outputs.image_ref }}
    permissions:
      contents: read
      id-token: write

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - build-site
      - build-import
      - release
      - deploy
    permissions:
      contents: write
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
