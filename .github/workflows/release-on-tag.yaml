name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test-on-call.yaml

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Build and Push Images
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KO_DOCKER_REPO: ghcr.io/${{ github.repository }}

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: release
    environment: saas
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193  # v2.1.10
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a  # v2.1.4

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          echo "Deploying devpulse-site and devpulse-import:${TAG}..."
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region=${{ vars.REGION }} \
            --image=ghcr.io/thingzio/devpulse-site:${TAG}
          gcloud run jobs update ${{ vars.JOB_NAME }} \
            --region=${{ vars.REGION }} \
            --image=ghcr.io/thingzio/devpulse-import:${TAG}

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - release
      - deploy
    permissions:
      contents: write
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
