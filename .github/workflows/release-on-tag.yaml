name: publish

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  test:
    uses: ./.github/workflows/test-on-call.yaml
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC in unit job

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go Environment
        uses: ./.github/actions/setup-go-env

      - name: Load Settings
        shell: bash
        run: |
          set -euo pipefail
          echo "GORELEASER_VERSION=$(yq -r '.build_tools.goreleaser' .settings.yaml)" >> "$GITHUB_ENV"

      - name: Setup Build Tools
        uses: ./.github/actions/setup-build-tools

      - name: Build and Push Images
        uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29  # v7.0.0
        with:
          distribution: goreleaser
          version: ${{ env.GORELEASER_VERSION }}
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        uses: imjasonh/setup-crane@6da1ae018866400525525ce74ff892880c099987  # v0.5

      - name: Extract Image Digests
        id: digests
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          for img in devpulse-site devpulse-import devpulse-admin; do
            DIGEST=$(crane digest "ghcr.io/thingzio/${img}:${TAG}" 2>/dev/null || true)
            echo "${img}=${DIGEST}" >> "$GITHUB_OUTPUT"
          done

      - name: Attest devpulse-site
        if: steps.digests.outputs.devpulse-site != ''
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ghcr.io/thingzio/devpulse-site
          subject-digest: ${{ steps.digests.outputs.devpulse-site }}
          push-to-registry: true

      - name: Attest devpulse-import
        if: steps.digests.outputs.devpulse-import != ''
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ghcr.io/thingzio/devpulse-import
          subject-digest: ${{ steps.digests.outputs.devpulse-import }}
          push-to-registry: true

      - name: Attest devpulse-admin
        if: steps.digests.outputs.devpulse-admin != ''
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32  # v4.1.0
        with:
          subject-name: ghcr.io/thingzio/devpulse-admin
          subject-digest: ${{ steps.digests.outputs.devpulse-admin }}
          push-to-registry: true

  deploy:
    needs: release
    uses: ./.github/workflows/deploy-cloud-run.yaml
    with:
      image_tag: ${{ github.ref_name }}
    permissions:
      contents: read
      id-token: write

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - release
      - deploy
    permissions:
      contents: write
    steps:
      - name: Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
