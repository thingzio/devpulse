name: deploy-saas

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to deploy'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: saas

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@ba79af03959ebeac9769e648f473a284504d9193  # v2.1.10
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@77e7a554d41e2ee56fc945c52dfd3f33d12def9a  # v2.1.4

      - name: Deploy Cloud Run Service and Job
        shell: bash
        run: |
          set -euo pipefail
          AR="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.AR_REPO }}"
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region=${{ vars.REGION }} \
            --image="${AR}/thingzio/devpulse-site:${{ inputs.image_tag }}"
          gcloud run jobs update ${{ vars.JOB_NAME }} \
            --region=${{ vars.REGION }} \
            --image="${AR}/thingzio/devpulse-import:${{ inputs.image_tag }}"
