name: deploy-saas

on:
  workflow_dispatch:
    inputs:
      site_image_ref:
        description: >-
          Immutable site image reference, ghcr.io/<org>/<image>@sha256:<digest>.
          Resolve one with: crane digest ghcr.io/thingzio/devpulse-site:<tag>
        required: true
        type: string
      import_image_ref:
        description: >-
          Immutable import image reference. Resolve with:
          crane digest ghcr.io/thingzio/devpulse-import:<tag>
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-cloud-run.yaml
    with:
      site_image_ref: ${{ inputs.site_image_ref }}
      import_image_ref: ${{ inputs.import_image_ref }}
    permissions:
      contents: read
      id-token: write
