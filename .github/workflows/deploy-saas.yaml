name: deploy-saas

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Container image tag to deploy'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: saas

    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093  # v3.0.0
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db  # v3.0.1

      - name: Deploy Cloud Run Service and Job
        shell: bash
        run: |
          set -euo pipefail
          AR="${{ vars.REGION }}-docker.pkg.dev/${{ vars.PROJECT_ID }}/${{ vars.AR_REPO }}"
          gcloud run services update ${{ vars.SERVICE_NAME }} \
            --region=${{ vars.REGION }} \
            --image="${AR}/thingzio/devpulse-site:${{ inputs.image_tag }}"
          gcloud run jobs update ${{ vars.JOB_NAME }} \
            --region=${{ vars.REGION }} \
            --image="${AR}/thingzio/devpulse-import:${{ inputs.image_tag }}"
          gcloud run services update ${{ vars.ADMIN_SERVICE_NAME }} \
            --region=${{ vars.REGION }} \
            --image="${AR}/thingzio/devpulse-admin:${{ inputs.image_tag }}"
