---
name: deploy-cloud-run

# Thin wrapper over the shared thingzio/actions deploy workflow. All this repo
# contributes is which resource gets which image; the validation, the Artifact
# Registry rewrite and the rollout live there.
#
# https://github.com/thingzio/actions/blob/main/.github/workflows/deploy-cloud-run.md

on:
  workflow_call:
    inputs:
      site_image_ref:
        description: >-
          Immutable reference for the site image, as
          ghcr.io/<org>/<image>@sha256:<digest>. A tag is deliberately not
          accepted: a tag can move between the build and the deploy, and then
          the thing that was tested is not the thing that ships.
        required: true
        type: string
      import_image_ref:
        description: Immutable reference for the import worker image
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      contents: read
      id-token: write
    uses: thingzio/actions/.github/workflows/deploy-cloud-run.yaml@368b3e12df4c41d9079b26e41a03efcd90461d56  # v1.7.1
    with:
      # Named here rather than read from vars.SERVICE_NAME / vars.JOB_NAME: a
      # job that calls a reusable workflow cannot see environment-scoped
      # variables, and these names are not secrets.
      #
      # The service first, then the import job. They are independent -- the job
      # is a scheduled worker, not a consumer of the service -- so the order
      # carries no meaning here beyond deploying the user-facing thing first.
      targets: |
        service=devpulse-saas-serve=${{ inputs.site_image_ref }}
        job=devpulse-saas-import=${{ inputs.import_image_ref }}
