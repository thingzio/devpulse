name: test

on:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC upload
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: thingzio/actions/.github/actions/setup-go@ff1417093cf175d18c6b78266245a7f35fbe995a  # v1.3.0

      - name: Unit Test
        run: make test

      # Skipped for pull requests from forks. GitHub does not issue an OIDC
      # token to fork PRs, so use_oidc would fail and show every external
      # contributor a red check on their first contribution. Coverage for
      # fork PRs is reported when the change lands on main.
      - name: Upload Coverage
        if: github.event.pull_request.head.repo.fork != true
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          flags: unittests
          use_oidc: true
          fail_ci_if_error: false

  # gofmt, go vet and golangci-lint, at the org-pinned linter version.
  lint:
    permissions:
      contents: read
    uses: thingzio/actions/.github/workflows/lint-go.yaml@ff1417093cf175d18c6b78266245a7f35fbe995a  # v1.3.0

  # Kept here rather than in lint-go: that workflow is Go-only, and a YAML
  # linter belongs with the repository's own .yamllint.yaml.
  lint-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Lint YAML
        uses: karancode/yamllint-github-action@4052d365f09b8d34eb552c363d1141fd60e2aeb2  # v3.0.0
        with:
          yamllint_config_filepath: .yamllint.yaml

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.5-alpine
        env:
          POSTGRES_DB: devpulse_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d devpulse_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: thingzio/actions/.github/actions/setup-go@ff1417093cf175d18c6b78266245a7f35fbe995a  # v1.3.0

      - name: Postgres Integration Tests
        env:
          DEVPULSE_TEST_DSN: "postgres://test:test@localhost:5432/devpulse_test?sslmode=disable"
        run: go test -v -race -count=1 -timeout=600s ./pkg/data/postgres/... ./pkg/server/... ./pkg/tenant/...

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go Environment
        uses: thingzio/actions/.github/actions/setup-go@ff1417093cf175d18c6b78266245a7f35fbe995a  # v1.3.0

      - name: E2E Test
        run: make e2e
