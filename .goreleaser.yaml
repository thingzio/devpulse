version: 2

project_name: devpulse

builds:
  - id: devpulse-site
    binary: devpulse-site
    dir: ./cmd/devpulse-site
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
        -X main.version={{.Version}}
        -X main.commit={{.ShortCommit}}
        -X main.date={{.CommitDate}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: devpulse-import
    binary: devpulse-import
    dir: ./cmd/devpulse-import
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
        -X main.version={{.Version}}
        -X main.commit={{.ShortCommit}}
        -X main.date={{.CommitDate}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

  - id: devpulse-admin
    binary: devpulse-admin
    dir: ./cmd/devpulse-admin
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
        -X main.version={{.Version}}
        -X main.commit={{.ShortCommit}}
        -X main.date={{.CommitDate}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

release:
  github:
    owner: thingzio
    name: devpulse
  prerelease: auto
  draft: true

kos:
  - id: devpulse-site
    build: devpulse-site
    repositories:
      - us-west1-docker.pkg.dev/thingzio/devpulse-saas-images/devpulse-site
    platforms:
      - linux/amd64
    tags:
      - latest
      - "{{.Tag}}"
    preserve_import_paths: false
    bare: true

  - id: devpulse-import
    build: devpulse-import
    repositories:
      - us-west1-docker.pkg.dev/thingzio/devpulse-saas-images/devpulse-import
    platforms:
      - linux/amd64
    tags:
      - latest
      - "{{.Tag}}"
    preserve_import_paths: false
    bare: true

  - id: devpulse-admin
    build: devpulse-admin
    repositories:
      - us-west1-docker.pkg.dev/thingzio/devpulse-saas-images/devpulse-admin
    platforms:
      - linux/amd64
    tags:
      - latest
      - "{{.Tag}}"
    preserve_import_paths: false
    bare: true

report_sizes: true

snapshot:
  version_template: "{{.Tag}}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^build:"
      - "^ci:"
      - "^style:"
      - typo
      - readme
