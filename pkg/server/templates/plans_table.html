{{define "plans_table"}}
<div class="plans-table-wrap">
  <table class="plans-table">
    <thead>
      <tr>
        <th></th>
        {{range .Plans}}
        <th id="plan-{{.Name}}"><a href="#plan-{{.Name}}">{{.DisplayName}}</a>{{if .PriceLabel}} <span style="font-size:0.75em;font-weight:normal;color:var(--gray);">({{.PriceLabel}})</span>{{end}}</th>
        {{end}}
      </tr>
    </thead>
    <tbody>
      {{range .Features}}
      <tr id="{{.ID}}">
        <td><a href="#{{.ID}}">{{.Label}}</a></td>
        {{if .Span}}
        <td colspan="{{len .Values}}">{{index .Values 0}}</td>
        {{else}}
        {{range .Values}}
        <td>{{.}}</td>
        {{end}}
        {{end}}
      </tr>
      {{end}}
    </tbody>
  </table>
  <p style="margin-top:8px;font-size:0.8em;color:var(--gray);text-align:right;">* During the beta preview the Pro plan is free for all users</p>
</div>
{{end}}
