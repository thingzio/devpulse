{{define "content"}}
<div class="top-bar">
  <h1>DevPulse</h1>
  <div class="user">
    {{.Username}}
    <form method="POST" action="/auth/signout">
      <button type="submit">Sign out</button>
    </form>
  </div>
</div>
<div class="page-content">
<div class="grid">

<article>
  <h3>Repository Overview</h3>
  <div id="repo-overview"></div>
</article>

<article>
  <h3>Add Repos</h3>
  <div class="search-box">
    <input type="text" id="repo-search" placeholder="Search repos (e.g. kubernetes, NVIDIA/aicr)..." autocomplete="off">
    <div id="search-results" class="search-dropdown"></div>
  </div>
  <p id="search-status" class="status"></p>
  {{if .GitHubAppURL}}
  <p style="margin-top:12px"><a href="{{.GitHubAppURL}}" target="_blank">Connect private repos via GitHub App &rarr;</a></p>
  {{end}}
</article>

</div>
</div>

<script>
(function() {
  const overviewEl = document.getElementById('repo-overview');
  const searchEl = document.getElementById('repo-search');
  const resultsEl = document.getElementById('search-results');
  const statusEl = document.getElementById('search-status');
  let debounceTimer;

  function loadOverview() {
    fetch('/api/repos/overview')
      .then(r => r.json())
      .then(repos => {
        if (!repos || repos.length === 0) {
          overviewEl.innerHTML = '<p class="status">No repos tracked yet. Search below to add one.</p>';
          return;
        }
        let html = '<table id="repo-overview-table"><thead><tr>' +
          '<th>Repository</th>' +
          '<th class="num">Stars</th>' +
          '<th class="num">Forks</th>' +
          '<th class="num">Issues</th>' +
          '<th class="num">Events</th>' +
          '<th class="num">Contributors</th>' +
          '<th class="num">Scored</th>' +
          '<th>Language</th>' +
          '<th>License</th>' +
          '<th>Last Import</th>' +
          '<th></th></tr></thead><tbody>';
        repos.forEach(r => {
          const name = esc(r.org) + '/' + esc(r.repo);
          const url = 'https://github.com/' + encodeURIComponent(r.org) + '/' + encodeURIComponent(r.repo);
          const importTs = r.last_import ? new Date(r.last_import) : null;
          const imported = importTs
            ? formatImportDate(r.last_import)
            : '<span class="pending">Pending</span>';
          const importTitle = importTs ? ' title="' + esc(importTs.toLocaleString()) + '"' : '';
          const importSort = importTs ? importTs.getTime() : 0;
          const scored = r.scored > 0 ? r.scored + '/' + r.contributors : '';
          html += '<tr>' +
            '<td><a href="' + url + '" target="_blank">' + name + '</a></td>' +
            '<td class="num">' + num(r.stars) + '</td>' +
            '<td class="num">' + num(r.forks) + '</td>' +
            '<td class="num">' + num(r.open_issues) + '</td>' +
            '<td class="num">' + num(r.events) + '</td>' +
            '<td class="num">' + num(r.contributors) + '</td>' +
            '<td class="num">' + scored + '</td>' +
            '<td>' + esc(r.language) + '</td>' +
            '<td>' + esc(r.license) + '</td>' +
            '<td data-sort-value="' + importSort + '"' + importTitle + '>' + imported + '</td>' +
            '<td><button onclick="removeRepo(\'' + esc(r.org) + '\',\'' + esc(r.repo) + '\')">Remove</button></td></tr>';
        });
        html += '</tbody></table>';
        html += '<div class="table-footer">Overview of tracked repositories.</div>';
        overviewEl.innerHTML = html;
        initTableSort('repo-overview-table');
      })
      .catch(() => { overviewEl.innerHTML = '<p class="status">Failed to load repos.</p>'; });
  }

  window.removeRepo = function(org, repo) {
    fetch('/api/repos/' + encodeURIComponent(org) + '/' + encodeURIComponent(repo), {method:'DELETE'})
      .then(r => { if (r.ok) loadOverview(); });
  };

  window.addRepo = function(org, repo) {
    statusEl.textContent = 'Adding...';
    const body = new URLSearchParams({org: org, repo: repo});
    fetch('/api/repos', {method:'POST', body: body})
      .then(r => {
        if (r.ok) {
          loadOverview();
          searchEl.value = '';
          resultsEl.style.display = 'none';
          statusEl.textContent = '';
        } else {
          r.text().then(t => { statusEl.textContent = t; });
        }
      });
  };

  searchEl.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    const q = searchEl.value.trim();
    if (q.length < 2) {
      resultsEl.style.display = 'none';
      statusEl.textContent = '';
      return;
    }
    statusEl.textContent = 'Searching...';
    debounceTimer = setTimeout(function() {
      fetch('/api/repos/available?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(repos => {
          statusEl.textContent = '';
          if (!repos || repos.length === 0) {
            resultsEl.innerHTML = '<div>No repos found</div>';
            resultsEl.style.display = 'block';
            return;
          }
          resultsEl.innerHTML = repos.map(r =>
            '<div onclick="addRepo(\'' + esc(r.Org) + '\',\'' + esc(r.Repo) + '\')">' +
            esc(r.Org) + '/' + esc(r.Repo) + '</div>'
          ).join('');
          resultsEl.style.display = 'block';
        })
        .catch(() => {
          statusEl.textContent = '';
          resultsEl.style.display = 'none';
        });
    }, 400);
  });

  document.addEventListener('click', function(e) {
    if (!resultsEl.contains(e.target) && e.target !== searchEl) {
      resultsEl.style.display = 'none';
    }
  });

  function num(n) { return (n || 0).toLocaleString(); }
  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  loadOverview();
})();
</script>
{{end}}
