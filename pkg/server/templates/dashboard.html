{{define "content"}}
<h1>Dashboard</h1>
<p>Welcome, {{.Username}}
  <form method="POST" action="/auth/signout" style="display:inline">
    <button type="submit">Sign out</button>
  </form>
</p>

<h2>Tracked Repos</h2>
<div id="tracked-repos"><em>Loading...</em></div>

<h2>Add Repos</h2>
<div style="position:relative">
  <input type="text" id="repo-search" placeholder="Search available repos..." autocomplete="off" style="width:100%;max-width:400px;padding:6px">
  <div id="search-results" style="position:absolute;background:#fff;border:1px solid #ccc;max-height:200px;overflow-y:auto;width:400px;display:none;z-index:10"></div>
</div>
<p id="search-status"></p>

<p><a href="https://github.com/apps/devpulse/installations/new" target="_blank">Connect more repos via GitHub App &rarr;</a></p>

<script>
(function() {
  const trackedEl = document.getElementById('tracked-repos');
  const searchEl = document.getElementById('repo-search');
  const resultsEl = document.getElementById('search-results');
  const statusEl = document.getElementById('search-status');
  let debounceTimer;

  function loadTracked() {
    fetch('/api/repos')
      .then(r => r.json())
      .then(repos => {
        if (!repos || repos.length === 0) {
          trackedEl.innerHTML = '<p>No repos tracked yet. Search below or connect repos via GitHub App.</p>';
          return;
        }
        const items = repos.map(r =>
          '<li>' + esc(r.Org) + '/' + esc(r.Repo) +
          ' <button onclick="removeRepo(\'' + esc(r.Org) + '\',\'' + esc(r.Repo) + '\')">Remove</button></li>'
        ).join('');
        trackedEl.innerHTML = '<ul>' + items + '</ul>';
      })
      .catch(() => { trackedEl.innerHTML = '<p>Failed to load repos.</p>'; });
  }

  window.removeRepo = function(org, repo) {
    fetch('/api/repos/' + encodeURIComponent(org) + '/' + encodeURIComponent(repo), {method:'DELETE'})
      .then(r => { if (r.ok) loadTracked(); });
  };

  window.addRepo = function(org, repo) {
    const body = new URLSearchParams({org: org, repo: repo});
    fetch('/api/repos', {method:'POST', body: body})
      .then(r => {
        if (r.ok) {
          loadTracked();
          searchEl.value = '';
          resultsEl.style.display = 'none';
        } else {
          r.text().then(t => { statusEl.textContent = t; });
        }
      });
  };

  searchEl.addEventListener('input', function() {
    clearTimeout(debounceTimer);
    const q = searchEl.value.trim();
    if (q.length < 2) {
      resultsEl.style.display = 'none';
      return;
    }
    debounceTimer = setTimeout(function() {
      fetch('/api/repos/available?q=' + encodeURIComponent(q))
        .then(r => r.json())
        .then(repos => {
          if (!repos || repos.length === 0) {
            resultsEl.innerHTML = '<div style="padding:6px">No repos found</div>';
            resultsEl.style.display = 'block';
            return;
          }
          const items = repos.map(r =>
            '<div style="padding:6px;cursor:pointer;border-bottom:1px solid #eee" onclick="addRepo(\'' +
            esc(r.Org) + '\',\'' + esc(r.Repo) + '\')">' +
            esc(r.Org) + '/' + esc(r.Repo) + '</div>'
          ).join('');
          resultsEl.innerHTML = items;
          resultsEl.style.display = 'block';
        })
        .catch(() => { resultsEl.style.display = 'none'; });
    }, 300);
  });

  document.addEventListener('click', function(e) {
    if (!resultsEl.contains(e.target) && e.target !== searchEl) {
      resultsEl.style.display = 'none';
    }
  });

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  loadTracked();
})();
</script>
{{end}}
