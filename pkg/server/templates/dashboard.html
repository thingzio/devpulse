{{define "content"}}
<h1>Dashboard</h1>
<p>Welcome, {{.Username}}
  <form method="POST" action="/auth/signout" style="display:inline">
    <button type="submit">Sign out</button>
  </form>
</p>

<h2>Tracked Repos</h2>
<div id="tracked-repos"><em>Loading...</em></div>

<h2>Add Repo</h2>
<form id="add-repo-form" style="display:flex;gap:8px;align-items:center;max-width:500px">
  <input type="text" id="repo-input" placeholder="org/repo (e.g. kubernetes/kubernetes)" autocomplete="off" style="flex:1;padding:6px" required>
  <button type="submit">Add</button>
</form>
<p id="add-status"></p>

{{if .GitHubAppURL}}
<p><a href="{{.GitHubAppURL}}" target="_blank">Connect more repos via GitHub App &rarr;</a></p>
{{end}}

<script>
(function() {
  const trackedEl = document.getElementById('tracked-repos');
  const formEl = document.getElementById('add-repo-form');
  const inputEl = document.getElementById('repo-input');
  const statusEl = document.getElementById('add-status');

  function loadTracked() {
    fetch('/api/repos')
      .then(r => r.json())
      .then(repos => {
        if (!repos || repos.length === 0) {
          trackedEl.innerHTML = '<p>No repos tracked yet. Add one above.</p>';
          return;
        }
        const items = repos.map(r =>
          '<li>' + esc(r.Org) + '/' + esc(r.Repo) +
          ' <button onclick="removeRepo(\'' + esc(r.Org) + '\',\'' + esc(r.Repo) + '\')">Remove</button></li>'
        ).join('');
        trackedEl.innerHTML = '<ul>' + items + '</ul>';
      })
      .catch(() => { trackedEl.innerHTML = '<p>Failed to load repos.</p>'; });
  }

  window.removeRepo = function(org, repo) {
    fetch('/api/repos/' + encodeURIComponent(org) + '/' + encodeURIComponent(repo), {method:'DELETE'})
      .then(r => { if (r.ok) loadTracked(); });
  };

  formEl.addEventListener('submit', function(e) {
    e.preventDefault();
    statusEl.textContent = '';
    const val = inputEl.value.trim();
    const parts = val.split('/');
    if (parts.length !== 2 || !parts[0] || !parts[1]) {
      statusEl.textContent = 'Format: org/repo';
      return;
    }
    const body = new URLSearchParams({org: parts[0], repo: parts[1]});
    fetch('/api/repos', {method:'POST', body: body})
      .then(r => {
        if (r.ok) {
          loadTracked();
          inputEl.value = '';
        } else {
          r.text().then(t => { statusEl.textContent = t; });
        }
      });
  });

  function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  loadTracked();
})();
</script>
{{end}}
