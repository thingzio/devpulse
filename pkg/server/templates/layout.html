<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} - DevPulse</title>
<meta name="description" content="Understand the health of any open source project at a glance. Track contributor activity, PR velocity, and community trends.">
<meta property="og:type" content="website">
<meta property="og:title" content="{{.Title}} - DevPulse">
<meta property="og:description" content="Understand the health of any open source project at a glance. Track contributor activity, PR velocity, and community trends.">
<meta property="og:url" content="https://devpulse.thingz.io">
<meta property="og:image" content="https://devpulse.thingz.io/static/img/dashboard.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{.Title}} - DevPulse">
<meta name="twitter:description" content="Understand the health of any open source project at a glance. Track contributor activity, PR velocity, and community trends.">
<meta name="twitter:image" content="https://devpulse.thingz.io/static/img/dashboard.png">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
{{block "nav" .}}
<nav class="top-nav">
    <a href="/dashboard" class="top-nav-brand">DevPulse</a>
</nav>
{{end}}
{{template "content" .}}
  <footer class="page-footer">
    <span>Version {{ appVersion }} ({{ appCommit }} - {{ appBuildDate }})</span>
    <span><a href="/changelog">Changelog</a> &middot; <a href="/help">Help</a> &middot; <a href="/tos">Terms</a></span>
  </footer>
</body>
</html>
